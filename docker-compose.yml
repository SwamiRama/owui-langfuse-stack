# Production-ready POC stack: Open WebUI + Langfuse v3 + Caddy
#
# Quick start:
#   1. cp .env.example .env  &&  edit secrets (see README.md "Generating Secrets")
#   2. Point DNS A-records of DOMAIN_OWUI and DOMAIN_LANGFUSE to this server
#   3. docker compose config            # validate
#   4. docker compose up -d
#   5. docker compose logs -f langfuse-web   # wait for "Ready"

name: owui-langfuse-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── Caddy (Reverse Proxy + Auto-HTTPS) ─────────────────────────────────
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    environment:
      - DOMAIN_OWUI=${DOMAIN_OWUI}
      - DOMAIN_LANGFUSE=${DOMAIN_LANGFUSE}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ki-net]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Open WebUI ─────────────────────────────────────────────────────────
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.9.2
    container_name: openwebui
    restart: unless-stopped
    logging: *default-logging
    expose: ["8080"]
    environment:
      # Public URL — must match Caddyfile entry
      - WEBUI_URL=${OPENWEBUI_URL}

      # Auth & onboarding
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}     # set to false after first admin
      - DEFAULT_USER_ROLE=pending                # admin must approve new users
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}

      # LLM providers (OpenRouter + Pipelines)
      - OPENAI_API_BASE_URLS=https://openrouter.ai/api/v1;http://pipelines:9099
      - OPENAI_API_KEYS=${OPENROUTER_API_KEY};${PIPELINES_API_KEY}

      # Disable Ollama unless used (avoid 11434 connect attempts in logs)
      - ENABLE_OLLAMA_API=false

      # Optional: OAuth / SSO (uncomment block in .env to enable)
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-false}
      - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-}
      - OAUTH_SCOPES=${OAUTH_SCOPES:-openid email profile}
      - ENABLE_OAUTH_GROUP_MANAGEMENT=${ENABLE_OAUTH_GROUP_MANAGEMENT:-false}
      - OAUTH_GROUPS_CLAIM=${OAUTH_GROUPS_CLAIM:-groups}
      - ENABLE_OAUTH_GROUP_CREATION=${ENABLE_OAUTH_GROUP_CREATION:-false}
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-false}
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      pipelines:
        condition: service_healthy
    networks: [ki-net]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # ─── Pipelines (plugin host — Langfuse filters etc.) ────────────────────
  # Pinned by digest because upstream has no tagged releases (only :main).
  # To upgrade: pull the latest digest with
  #   docker buildx imagetools inspect ghcr.io/open-webui/pipelines:main
  pipelines:
    image: ghcr.io/open-webui/pipelines:main@sha256:b48e9bc338ce2be0acfbeff01810db72408a12f07739f9e3879c1f2b00952d6e
    container_name: pipelines
    restart: unless-stopped
    logging: *default-logging
    expose: ["9099"]
    environment:
      - PIPELINES_API_KEY=${PIPELINES_API_KEY}
    volumes:
      - pipelines_data:/app/pipelines
    networks: [ki-net]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9099/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  # ─── Langfuse Web (UI + API) ────────────────────────────────────────────
  langfuse-web:
    image: langfuse/langfuse:3.172.1
    container_name: langfuse-web
    restart: unless-stopped
    logging: *default-logging
    expose: ["3000"]
    environment: &langfuse-env
      # Bind on all interfaces — Next.js 16 defaults to the container
      # hostname, which makes localhost/127.0.0.1 healthchecks fail.
      HOSTNAME: "0.0.0.0"

      # Core
      NEXTAUTH_URL: ${LANGFUSE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"

      # Postgres
      DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/langfuse

      # ClickHouse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_AUTH}

      # S3 — Event Upload
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "events/"

      # S3 — Media Upload (multimodal traces)
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: "media/"

      # S3 — Batch Export
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: "exports/"
      LANGFUSE_S3_BATCH_EXPORT_REGION: auto
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"

      # Headless init — auto-creates org / project / admin on first start.
      # IMPORTANT: remove these from .env after the first successful start.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    depends_on:
      postgres:    { condition: service_healthy }
      clickhouse:  { condition: service_healthy }
      redis:       { condition: service_healthy }
      minio:       { condition: service_healthy }
    networks: [ki-net]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G

  # ─── Langfuse Worker (async event processing) ───────────────────────────
  langfuse-worker:
    image: langfuse/langfuse-worker:3.172.1
    container_name: langfuse-worker
    restart: unless-stopped
    logging: *default-logging
    expose: ["3030"]
    environment:
      <<: *langfuse-env
    depends_on:
      postgres:    { condition: service_healthy }
      clickhouse:  { condition: service_healthy }
      redis:       { condition: service_healthy }
      minio:       { condition: service_healthy }
    networks: [ki-net]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3030/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # ─── PostgreSQL (Langfuse transactional) ────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ki-net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── ClickHouse (Langfuse OLAP traces/observations) ─────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: clickhouse
    restart: unless-stopped
    logging: *default-logging
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      # Use 127.0.0.1 (not localhost) — busybox resolves localhost to [::1]
      # but ClickHouse only binds IPv4 on default Docker bridge networks.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ki-net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 4G

  # ─── Redis (Langfuse queue + cache) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${REDIS_AUTH}
      --maxmemory 384mb
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ki-net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── MinIO (S3-compatible blob storage) ─────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    logging: *default-logging
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9091:9001"   # Console only on localhost — SSH tunnel for access
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ki-net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  caddy_data:
  caddy_config:
  openwebui_data:
  pipelines_data:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  minio_data:

networks:
  ki-net:
    driver: bridge
